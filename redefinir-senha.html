<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabaseClient.js"></script>
    <script>
        const SENHA_RE = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;
        const HASH_INICIAL = window.location.hash || '';
        const SEARCH_INICIAL = window.location.search || '';
        const params = new URLSearchParams(SEARCH_INICIAL);
        
        // Suporta tanto o formato PKCE (?code=...) quanto o antigo (#type=recovery)
        const veioDeRecuperacao = params.has('code') || /type=recovery/.test(HASH_INICIAL);
        const $ = id => document.getElementById(id);
        let formularioAberto = false;

        function mostrar(id) {
            document.querySelectorAll('.estado').forEach(e => e.classList.remove('ativo'));
            $(id).classList.add('ativo');
            if (id === 'formulario') { formularioAberto = true; $('nova-senha').focus(); }
        }

        function marcar(idCampo, msg) {
            const campo = $(idCampo), dica = $(idCampo + '-hint');
            campo.classList.toggle('invalid', !!msg);
            campo.classList.toggle('valid', !msg && campo.value !== '');
            dica.textContent = msg || (idCampo === 'nova-senha' ? 'Mínimo de 8 caracteres, com letras e números.' : '');
            dica.classList.toggle('error', !!msg);
        }

        const validarSenha = () => { const m = SENHA_RE.test($('nova-senha').value) ? '' : 'A senha precisa ter pelo menos 8 caracteres, com letras e números.'; marcar('nova-senha', m); return !m; };
        const validarConfirma = () => { const m = $('confirma-senha').value === $('nova-senha').value ? '' : 'As senhas não coincidem.'; marcar('confirma-senha', m); return !m; };

        $('nova-senha').addEventListener('input', () => { $('msg-erro').style.display = 'none'; if ($('nova-senha').dataset.t) validarSenha(); if ($('confirma-senha').dataset.t) validarConfirma(); });
        $('nova-senha').addEventListener('blur', () => { $('nova-senha').dataset.t = '1'; validarSenha(); });
        $('confirma-senha').addEventListener('input', () => { $('msg-erro').style.display = 'none'; if ($('confirma-senha').dataset.t) validarConfirma(); });
        $('confirma-senha').addEventListener('blur', () => { $('confirma-senha').dataset.t = '1'; validarConfirma(); });

        async function salvarNovaSenha(event) {
            event.preventDefault();
            $('nova-senha').dataset.t = $('confirma-senha').dataset.t = '1';
            const ok1 = validarSenha(), ok2 = validarConfirma();
            if (!ok1 || !ok2) { (ok1 ? $('confirma-senha') : $('nova-senha')).focus(); return; }

            const botao = $('btn-salvar');
            botao.disabled = true;
            const { error } = await supabaseClient.auth.updateUser({ password: $('nova-senha').value });
            botao.disabled = false;

            if (error) {
                const msg = error.message || '';
                if (error.code === 'same_password' || /different from the old/i.test(msg)) marcar('nova-senha', 'A nova senha precisa ser diferente da anterior.');
                else if (error.code === 'weak_password' || /password/i.test(msg)) marcar('nova-senha', 'Senha fraca: use pelo menos 8 caracteres, com letras e números.');
                else if (/session|jwt|expired|not authenticated/i.test(msg)) mostrar('invalido');
                else { $('msg-erro').textContent = 'Não foi possível salvar agora. Tente de novo em instantes.'; $('msg-erro').style.display = 'block'; }
                return;
            }
            mostrar('pronto');
            setTimeout(() => { window.location.href = 'menu.html'; }, 2500);
        }

        // ---- Escuta alterações de autenticação ----
        supabaseClient.auth.onAuthStateChange((evento) => { 
            if (evento === 'PASSWORD_RECOVERY' || (evento === 'SIGNED_IN' && veioDeRecuperacao)) {
                mostrar('formulario');
            }
        });

        (async () => {
            if (/error(_code)?=/.test(HASH_INICIAL) || /error(_code)?=/.test(SEARCH_INICIAL)) {
                return mostrar('invalido');
            }
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (veioDeRecuperacao && session) {
                return mostrar('formulario');
            }
            // Tempo estendido para permitir a troca do código PKCE pelo Supabase
            setTimeout(() => { 
                if (!formularioAberto) mostrar('invalido'); 
            }, veioDeRecuperacao ? 4000 : 500);
        })();
    </script>
