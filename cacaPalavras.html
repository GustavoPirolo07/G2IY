<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Eco Caça-Palavras</title>
    <style>
        body { visibility: hidden; } /* só aparece após confirmar a sessão (protegerPagina.js) */
        body {font-family: 'Segoe UI', sans-serif; background: whitesmoke; color: #2e7d32; display: flex; flex-direction: column; align-items: center; padding: 20px;}
        .controls {display: flex; gap: 20px; align-items: center; margin-bottom: 20px;}
        button {padding: 10px 20px; font-size: 1rem; background-color: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s;}
        button:hover { background-color: #1b5e20; }
        .game-container {display: flex; flex-direction: row; gap: 30px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);}
        #grid { display: grid; grid-template-columns: repeat(10, 40px); /* Grid 10x10 */ gap: 2px; background: #a5d6a7; padding: 5px; border-radius: 8px;}
        .cell {width: 40px; height: 40px; background: #fff; display: flex; justify-content: center; align-items: center; font-size: 1rem; font-weight: bold; cursor: pointer; user-select: none;}
        .cell.selected { background: #fff59d; }
        .cell.found { background: #4caf50 !important; color: white; }
        #word-list { display: flex; flex-direction: column; gap: 8px; min-width: 150px; }
        .word-item { padding: 8px; border-left: 5px solid #81c784; background: #f1f8e9; border-radius: 0 5px 5px 0; font-weight: 600; text-transform: uppercase; }
        .word-found { text-decoration: line-through; background: #c8e6c9; color: #81c784; border-color: #c8e6c9; }
        #timer { font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>ECO CAÇA-PALAVRAS</h1>
    <div class="controls">
        <div id="timer">Tempo: 0s</div>
        <button onclick="initGame()">Novo Jogo</button>
        <button onclick="window.location.href='menu.html'" style="background-color: #666;">Voltar ao Menu</button>
    </div>
    <div class="game-container">
        <div id="grid"></div>
        <div id="word-list"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabaseClient.js"></script>
    <script src="protegerPagina.js"></script>
    <script>
        const bancoDePalavras = ["RECICLAR", "REUTILIZAR", "REDUZIR", "CLIMA", "VERDE", "POLUICAO", "ENERGIA", "AMBIENTE", "FLORA", "FAUNA", "OZONIO", "LIXO", "EOLICA", "MUNDO", "HORTA", "PLANO", "FOLHA"];
        const size = 10;
        let wordsCurrentSession = [];
        let wordsInfo = [];
        let foundCount = 0;
        let seconds = 0;
        let timerIdx = null;
        let jogoFinalizado = false;
        function initGame() {
            clearInterval(timerIdx);
            seconds = 0;
            foundCount = 0;
            jogoFinalizado = false;
            wordsInfo = [];
            wordsCurrentSession = [...bancoDePalavras]
                .sort(() => 0.5 - Math.random())
                .slice(0, 6);
            document.getElementById('timer').textContent = "Tempo: 0s";
            document.getElementById('grid').innerHTML = "";
            document.getElementById('word-list').innerHTML = "<h3 style='margin-top:0'>Palavras (6):</h3>";
            let gridArray = Array(size).fill().map(() => Array(size).fill(''));
            wordsCurrentSession.forEach(word => {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 100) {
                    let dir = Math.random() > 0.5 ? 'H' : 'V';
                    let r = Math.floor(Math.random() * size);
                    let c = Math.floor(Math.random() * size);
 
                    if (canPlace(word, r, c, dir, gridArray)) {
                        let coords = [];
                        for (let i = 0; i < word.length; i++) {
                            let currR = dir === 'V' ? r + i : r;
                            let currC = dir === 'H' ? c + i : c;
                            gridArray[currR][currC] = word[i];
                            coords.push({r: currR, c: currC});
                        }
                        wordsInfo.push({ word, coords, found: false });
                        placed = true;
                    }
                    attempts++;
                }
            });
            renderGrid(gridArray);
            renderList();
            timerIdx = setInterval(() => {
                seconds++;
                document.getElementById('timer').textContent = `Tempo: ${seconds}s`;
            }, 1000);
        }
        function canPlace(word, row, col, dir, grid) {
            if (dir === 'H' && col + word.length > size) return false;
            if (dir === 'V' && row + word.length > size) return false;
            for (let i = 0; i < word.length; i++) {
                let r = dir === 'V' ? row + i : row;
                let c = dir === 'H' ? col + i : col;
                if (grid[r][c] !== '' && grid[r][c] !== word[i]) return false;
            }
            return true;
        }
        function renderGrid(gridArray) {
            const gridEl = document.getElementById('grid');
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const char = gridArray[r][c] || String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = char;
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => {
                        cell.classList.toggle('selected');
                        checkWin();
                    };
                    gridEl.appendChild(cell);
                }
            }
        }
        function renderList() {
            const listEl = document.getElementById('word-list');
            wordsCurrentSession.forEach(w => {
                const div = document.createElement('div');
                div.className = 'word-item';
                div.id = 'list-' + w;
                div.textContent = w;
                listEl.appendChild(div);
            });
        }
        function checkWin() {
            wordsInfo.forEach(info => {
                if (info.found) return;
                let complete = info.coords.every(co =>
                    document.querySelector(`[data-r="${co.r}"][data-c="${co.c}"]`).classList.contains('selected')
                );
                if (complete) {
                    info.found = true;
                    foundCount++;
                    document.getElementById('list-' + info.word).classList.add('word-found');
                    info.coords.forEach(co => document.querySelector(`[data-r="${co.r}"][data-c="${co.c}"]`).classList.add('found'));
                }
            });
            if (wordsInfo.length > 0 && foundCount === wordsInfo.length && !jogoFinalizado) {
                jogoFinalizado = true;
                clearInterval(timerIdx);
                salvarPontos(50);
                setTimeout(() => alert(`Parabéns! Você encontrou as palavras em ${seconds} segundos! +50 pontos ecológicos`), 200);
            }
        }
        initGame();
    </script>
</body>
</html>
