<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura da Advinhação</title>
    <style>
        body {font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: whitesmoke; color: #2e7d32; }
        h1 {margin-top: 20px;}
        .controls { display: flex; gap: 15px; margin-top: 5px; margin-bottom: 10px; }
        button {padding: 10px 20px; font-size: 1rem; background-color: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s;}
        button:hover { background-color: #1b5e20; }
        #game-board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; margin-top: 20px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 50px; height: 50px; border: 2px solid #3a3a3c; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; text-transform: uppercase; }
        .correct { background-color: #538d4e; border-color: #538d4e; }
        .present { background-color: #b59f3b; border-color: #b59f3b; }
        .absent { background-color: #3a3a3c; border-color: #3a3a3c; }
        #input-area { margin-top: 20px; }
        input { padding: 10px; font-size: 1rem; }
    </style>
</head>
<body>
    <h1>ECO ADIVINHAÇÃO</h1>
    <div class="controls">
        <button onclick="window.location.href='menu.html'" style="background-color: #666;">Voltar ao Menu</button>
    </div>
    <div id="game-board"></div>
    <div id="input-area">
        <input type="text" id="guess-input" maxlength="5" autofocus>
        <button onclick="makeGuess()">Enviar</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabaseClient.js"></script>
    <script>
        exigirLogin(); // volta ao menu se não houver sessão
        const listaDePalavras = ["VIDRO", "LATAS", "PAPEL", "MUNDO", "CLIMA", "BIOMA", "CHUVA", "MATAS", "METAL", "PAMPA", "NUVEM", "SOLAR", "VERDE", "TERRA", "LIMPO", "ÁGUAS", "VIVER", "FAUNA", "FLORA", "LIXOS"];
        const word = listaDePalavras[Math.floor(Math.random() * listaDePalavras.length)];
        let attempts = 0;
        let acabou = false;
        const maxAttempts = 6;
        const board = document.getElementById("game-board");
        for (let i = 0; i < maxAttempts; i++) {
            let row = document.createElement("div");
            row.className = "row";
            for (let j = 0; j < 5; j++) {
                let tile = document.createElement("div");
                tile.className = "tile";
                row.appendChild(tile);
            }
            board.appendChild(row);
        }
        function makeGuess() {
            if (acabou) return;
            const input = document.getElementById("guess-input");
            const guess = input.value.toUpperCase();
            if (guess.length !== 5) return alert("Digite 5 letras!");
            const row = document.getElementsByClassName("row")[attempts];
            const tiles = row.getElementsByClassName("tile");
            let letterCount = {};
            for (let char of word) {
                letterCount[char] = (letterCount[char] || 0) + 1;
            }
            let results = new Array(5).fill("absent");
            for (let i = 0; i < 5; i++) {
                if (guess[i] === word[i]) {
                    results[i] = "correct";
                    letterCount[guess[i]]--;
                }
            }
            for (let i = 0; i < 5; i++) {
                if (results[i] !== "correct") {
                    if (word.includes(guess[i]) && letterCount[guess[i]] > 0) {
                        results[i] = "present";
                        letterCount[guess[i]]--;
                    }
                }
            }
            for (let i = 0; i < 5; i++) {
                boxTile = tiles[i];
                boxTile.textContent = guess[i];
                boxTile.classList.add(results[i]);
            }
            attempts++;
            input.value = "";
            if (guess === word) {
                acabou = true;
                const pontos = (maxAttempts + 1 - attempts) * 10;
                salvarPontos(pontos);
                return alert("Você venceu! +" + pontos + " pontos ecológicos");
            }
            if (attempts === maxAttempts) {
                acabou = true;
                alert("Fim de jogo! A palavra era: " + word);
            }
        }
    </script>
</body>
</html>
