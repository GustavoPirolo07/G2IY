<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura da Advinhação</title>
    <style>
        body { visibility: hidden; } /* só aparece após confirmar a sessão (protegerPagina.js) */
        :root {
            --gap: 6px;
            --sobra: 360px; /* espaço ocupado por título, botões, campo e margens */
            --tile: min(76px, calc((100vw - 84px) / 5));
        }
        /* o tabuleiro se ajusta à altura da tela para caber sem rolar */
        @supports (height: 100svh) {
            :root { --tile: max(38px, min(76px, calc((100vw - 84px) / 5), calc((100svh - var(--sobra)) / 5))); }
        }
        * { box-sizing: border-box; }
        body {font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: whitesmoke; color: #2e7d32; margin: 0; padding: 12px 12px 24px; min-height: 100vh; }
        h1 { margin: 18px 0 8px; font-size: 2rem; text-align: center; }
        .controls { display: flex; gap: 15px; margin-bottom: 14px; }
        button {padding: 10px 20px; font-size: 1rem; background-color: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s;}
        button:hover { background-color: #1b5e20; }
        .game-card { background: #fff; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 26px 28px; display: flex; flex-direction: column; align-items: center; max-width: 100%; }
        #game-board { display: grid; gap: var(--gap); }
        .row { display: grid; grid-template-columns: repeat(5, var(--tile)); gap: var(--gap); }
        .tile { width: var(--tile); height: var(--tile); border: 2px solid #3a3a3c; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: calc(var(--tile) * 0.5); font-weight: bold; text-transform: uppercase; }
        /* letra sempre branca; só o fundo muda de cor */
        .correct, .present, .absent { color: #fff; }
        .correct { background-color: #538d4e; border-color: #538d4e; }
        .present { background-color: #b59f3b; border-color: #b59f3b; }
        .absent { background-color: #3a3a3c; border-color: #3a3a3c; }
        #input-area { display: flex; gap: 8px; margin-top: 18px; width: calc(var(--tile) * 5 + var(--gap) * 4); }
        input { flex: 1; min-width: 0; padding: 12px; font-size: 1.1rem; border: 2px solid #a5d6a7; border-radius: 8px; outline: none; text-transform: uppercase; letter-spacing: 2px; }
        input:focus { border-color: #2e7d32; }
        #msg { color: #d32f2f; font-weight: 600; font-size: 0.9rem; min-height: 1.4em; margin-top: 8px; text-align: center; }
        @media (max-width: 600px) {
            :root { --gap: 5px; --sobra: 290px; }
            h1 { font-size: 1.4rem; margin: 10px 0 6px; }
            .controls { margin-bottom: 8px; }
            button { padding: 8px 14px; font-size: 0.95rem; }
            .game-card { padding: 16px 14px; }
            #input-area { margin-top: 14px; }
        }
    </style>
</head>
<body>
    <h1>ECO ADIVINHAÇÃO</h1>
    <div class="controls">
        <button onclick="window.location.href='menu.html'" style="background-color: #666;">Voltar ao Menu</button>
    </div>
    <main class="game-card">
        <div id="game-board"></div>
        <div id="input-area">
            <input type="text" id="guess-input" maxlength="5" placeholder="5 letras" autocomplete="off" autocapitalize="characters" enterkeyhint="send" aria-label="Digite uma palavra de 5 letras">
            <button onclick="makeGuess()">Enviar</button>
        </div>
        <div id="msg"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabaseClient.js"></script>
    <script src="protegerPagina.js"></script>
    <script src="resultados.js"></script>
    <script src="popupFim.js"></script>
    <script>
        const listaDePalavras = ["VIDRO", "LATAS", "PAPEL", "MUNDO", "CLIMA", "BIOMA", "CHUVA", "MATAS", "METAL", "PAMPA", "NUVEM", "SOLAR", "VERDE", "TERRA", "LIMPO", "ÁGUAS", "VIVER", "FAUNA", "FLORA", "LIXOS"];
        const semAcento = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const word = semAcento(listaDePalavras[Math.floor(Math.random() * listaDePalavras.length)]);
        let attempts = 0;
        let acabou = false;
        let msgTimer = null;
        const maxAttempts = 5;
        const board = document.getElementById("game-board");
        const campo = document.getElementById("guess-input");
        for (let i = 0; i < maxAttempts; i++) {
            let row = document.createElement("div");
            row.className = "row";
            for (let j = 0; j < 5; j++) {
                let tile = document.createElement("div");
                tile.className = "tile";
                row.appendChild(tile);
            }
            board.appendChild(row);
        }

        // Foca o campo ao abrir (só em computador: no celular isso abriria o teclado e cobriria o tabuleiro)
        window.paginaLiberada.then(ok => {
            if (ok && window.matchMedia('(pointer: fine)').matches) campo.focus();
        });

        // Enter envia a tentativa
        campo.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                e.preventDefault();
                makeGuess();
            }
        });

        function mostrarMsg(texto) {
            const m = document.getElementById("msg");
            m.textContent = texto;
            clearTimeout(msgTimer);
            msgTimer = setTimeout(() => { m.textContent = ""; }, 2500);
        }

        function makeGuess() {
            if (acabou) return;
            const guess = semAcento(campo.value.trim().toUpperCase());
            if (!/^[A-Z]{5}$/.test(guess)) {
                mostrarMsg("Digite uma palavra com 5 letras.");
                campo.focus();
                return;
            }
            const row = document.getElementsByClassName("row")[attempts];
            const tiles = row.getElementsByClassName("tile");
            let letterCount = {};
            for (let char of word) {
                letterCount[char] = (letterCount[char] || 0) + 1;
            }
            let results = new Array(5).fill("absent");
            for (let i = 0; i < 5; i++) {
                if (guess[i] === word[i]) {
                    results[i] = "correct";
                    letterCount[guess[i]]--;
                }
            }
            for (let i = 0; i < 5; i++) {
                if (results[i] !== "correct") {
                    if (word.includes(guess[i]) && letterCount[guess[i]] > 0) {
                        results[i] = "present";
                        letterCount[guess[i]]--;
                    }
                }
            }
            for (let i = 0; i < 5; i++) {
                const boxTile = tiles[i];
                boxTile.textContent = guess[i];
                boxTile.classList.add(results[i]);
            }
            attempts++;
            campo.value = "";
            campo.focus();

            if (guess === word) {
                acabou = true;
                const pontos = 100 - attempts * 10; // 1ª tentativa = 90, perde 10 por tentativa extra
                Promise.allSettled([registrarResultado('adivinhacao', pontos), esperar(700)]).then(() =>
                    mostrarPopupFim({
                        emoji: '💡',
                        titulo: 'Você acertou!',
                        mensagem: `A palavra era ${word}.`,
                        pontos,
                        detalhes: [`Tentativas: ${attempts} de ${maxAttempts}`],
                        onJogarNovamente: () => window.location.reload()
                    }));
                return;
            }
            if (attempts === maxAttempts) {
                acabou = true;
                esperar(700).then(() =>
                    mostrarPopupFim({
                        emoji: '🌱',
                        titulo: 'Não foi dessa vez',
                        mensagem: `A palavra era ${word}.`,
                        pontos: 0,
                        detalhes: ['Use as cores das letras como pista e tente de novo!'],
                        onJogarNovamente: () => window.location.reload()
                    }));
            }
        }
    </script>
</body>
</html>
