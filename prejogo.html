<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAventuras - Antes de jogar</title>
    <style>
        body { visibility: hidden; } /* só aparece após confirmar a sessão (protegerPagina.js) */
        :root { --verde: #2e7d32; --verde-escuro: #1b5e20; --fundo: #e8f5e9; --cartao: #f1f8e9; --borda: #81c784; --suave: #558b2f; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 12px; min-height: 100vh; background: var(--fundo); color: var(--verde); font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        .app { max-width: 920px; margin: 0 auto; }
        :focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
        button, a { font-family: inherit; }

        .voltar { display: inline-block; text-decoration: none; color: var(--verde); font-weight: 700; font-size: 0.9rem; background: var(--cartao); border: 2px solid var(--borda); border-radius: 999px; padding: 6px 14px; }
        .voltar:hover { background: #c8e6c9; }

        /* ---------- identidade do jogo ---------- */
        .hero { display: flex; align-items: center; gap: 16px; margin: 14px 0 16px; }
        .hero-arte { flex: none; width: 88px; height: 88px; background: #fff; border: 3px solid var(--borda); border-radius: 22px; box-shadow: 0 6px 16px rgba(0,0,0,.08); display: grid; place-items: center; }
        .hero-arte svg { width: 70px; height: 70px; display: block; }
        h1 { margin: 0; font-size: 1.7rem; line-height: 1.15; }
        .objetivo { margin: 4px 0 0; color: var(--suave); font-size: 0.98rem; line-height: 1.35; }

        /* ---------- duas colunas ---------- */
        .colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
        .cartao { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,.08); padding: 18px; }
        h2 { margin: 0 0 12px; font-size: 1.15rem; }
        .nota { margin: -6px 0 10px; font-size: 0.78rem; color: var(--suave); line-height: 1.35; }

        /* como jogar */
        .passos { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
        .passos li { display: flex; align-items: center; gap: 12px; background: var(--cartao); border-radius: 12px; padding: 10px 12px; font-size: 0.95rem; line-height: 1.35; color: #33691e; }
        .passos .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; background: #fff; border: 2px solid #dcedc8; display: grid; place-items: center; }
        .passos .ic svg { width: 22px; height: 22px; display: block; }
        .passos b { color: var(--verde-escuro); }
        .mini { display: inline-flex; gap: 2px; }
        .mini i { display: block; width: 8px; height: 18px; border-radius: 2px; }

        /* ranking */
        .rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
        .rk { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; background: #f7faf3; border: 2px solid transparent; }
        .rk .pos { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; color: var(--suave); background: #e3efd6; }
        .rk .nome { font-weight: 600; color: #2f4f2f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rk .valor { text-align: right; font-weight: 800; color: var(--verde-escuro); line-height: 1.1; white-space: nowrap; }
        .rk .valor small { display: block; font-weight: 600; font-size: 0.72rem; color: var(--suave); margin-top: 1px; }
        .rk .valor svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 3px; }
        .rk.top1 { background: #fff8e1; border-color: #f9a825; }
        .rk.top2 { background: #f1f5f7; border-color: #b0bec5; }
        .rk.top3 { background: #fbece6; border-color: #cd8a5a; }
        .rk.top1 .pos { background: #f9a825; color: #fff; }
        .rk.top2 .pos { background: #90a4ae; color: #fff; }
        .rk.top3 .pos { background: #cd7f32; color: #fff; }
        .rk.top1 .nome, .rk.top2 .nome, .rk.top3 .nome { font-weight: 800; }
        .rk.eu { border-color: var(--verde); }
        .rk .voce { font-size: 0.7rem; font-weight: 700; color: #fff; background: var(--verde); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
        .reticencias { text-align: center; color: var(--suave); line-height: 0.6; letter-spacing: 3px; }
        .sk { height: 40px; border-radius: 10px; background: linear-gradient(90deg, #eef5e8 25%, #f7faf3 50%, #eef5e8 75%); background-size: 200% 100%; animation: brilho 1.2s linear infinite; }
        @keyframes brilho { from { background-position: 200% 0; } to { background-position: -200% 0; } }
        .vazio { text-align: center; padding: 22px 8px 14px; color: var(--suave); line-height: 1.4; }
        .vazio svg { width: 56px; height: 56px; opacity: .8; }
        .vazio p { margin: 8px 0 0; font-size: 0.95rem; }

        /* ---------- botão iniciar ---------- */
        .barra-iniciar { position: sticky; bottom: 0; padding: 14px 0 6px; margin-top: 8px; display: flex; justify-content: center; background: linear-gradient(to bottom, rgba(232,245,233,0), var(--fundo) 40%); }
        .btn-iniciar { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 420px; padding: 16px 24px; font-size: 1.25rem; font-weight: 800; color: #fff; background: var(--verde); border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 6px 0 var(--verde-escuro), 0 10px 20px rgba(27,94,32,.25); transition: transform .1s, box-shadow .1s, background .15s; }
        .btn-iniciar:hover { background: #388e3c; }
        .btn-iniciar:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--verde-escuro), 0 4px 10px rgba(27,94,32,.25); }
        .btn-iniciar svg { width: 22px; height: 22px; }

        @media (max-width: 760px) {
            .colunas { grid-template-columns: 1fr; }
            .hero-arte { width: 74px; height: 74px; border-radius: 18px; }
            .hero-arte svg { width: 58px; height: 58px; }
            h1 { font-size: 1.4rem; }
            .objetivo { font-size: 0.92rem; }
            .cartao { padding: 14px; }
        }
        @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
    </style>
</head>
<body>
<div class="app">
    <a class="voltar" href="menu.html">‹ Voltar</a>

    <header class="hero">
        <div class="hero-arte" id="arte" aria-hidden="true"></div>
        <div>
            <h1 id="nome">Eco Aventuras</h1>
            <p class="objetivo" id="objetivo"></p>
        </div>
    </header>

    <main class="colunas">
        <section class="cartao" aria-labelledby="t-como">
            <h2 id="t-como">Como jogar</h2>
            <ul class="passos" id="passos"></ul>
        </section>
        <section class="cartao" aria-labelledby="t-rank">
            <h2 id="t-rank">Melhores pontuações</h2>
            <p class="nota" id="nota-rank" hidden></p>
            <div id="ranking" aria-live="polite"></div>
        </section>
    </main>

    <div class="barra-iniciar">
        <button type="button" class="btn-iniciar" id="btn-iniciar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 L19 12 L7 19.5 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            Iniciar jogo
        </button>
    </div>
</div>

const cores3 = `<span class="mini"><i style="background:#538d4e"></i><i style="background:#b59f3b"></i><i style="background:#3a3a3c"></i></span>`;

/* símbolo de reciclagem (três setas num triângulo), desenhado numa caixa de 24 x 24 */
function reciclagem(cor) {
    const R = 8.4, cx = 12, cy = 12.9, f = n => n.toFixed(1);
    const P = [-90, 30, 150].map(a => [cx + R * Math.cos(a * Math.PI / 180), cy + R * Math.sin(a * Math.PI / 180)]);
    let o = '';
    for (let k = 0; k < 3; k++) {
        const A = P[k], B = P[(k + 1) % 3], dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy);
        const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
        const i = [A[0] + dx * 0.2, A[1] + dy * 0.2], e = [A[0] + dx * 0.7, A[1] + dy * 0.7];
        const t = [e[0] + ux * 3.8, e[1] + uy * 3.8], b1 = [e[0] + nx * 2.8, e[1] + ny * 2.8], b2 = [e[0] - nx * 2.8, e[1] - ny * 2.8];
        o += `<path d="M${f(i[0])} ${f(i[1])} L${f(e[0])} ${f(e[1])}" stroke="${cor}" stroke-width="2.8" stroke-linecap="round" fill="none"/><polygon points="${f(t[0])},${f(t[1])} ${f(b1[0])},${f(b1[1])} ${f(b2[0])},${f(b2[1])}" fill="${cor}" stroke="${cor}" stroke-width=".8" stroke-linejoin="round"/>`;
    }
    return o;
}

        ${'ECOAR'.split('').map((l, i) => `<rect x="${4 + i * 14.5}" y="36" width="13" height="16" rx="3" fill="#538d4e"/><text x="${10.5 + i * 14.5}" y="48">${l}</text>`).join('')}

    quiz: `<svg viewBox="0 0 80 80"><path d="M10 12 H70 Q76 12 76 18 V52 Q76 58 70 58 H40 L24 72 V58 H10 Q4 58 4 52 V18 Q4 12 10 12 Z" fill="#43a047" stroke="#2e7d32" stroke-width="2.4" stroke-linejoin="round"/>

        <path d="M51 58 H44 M52 64 H46" stroke="#a9680f" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>`,

        <g transform="translate(40 62) scale(1.25) translate(-12 -12.9)">${reciclagem('#fff')}</g>

        <rect x="4" y="24" width="44" height="34" rx="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/><rect x="9" y="28" width="34" height="5" rx="2.5" fill="rgba(255,255,255,.25)"/>
        <g transform="translate(26 43) scale(1.15) translate(-12 -12.9)">${reciclagem('#fff')}</g>

/* ---------- montagem da tela ---------- */
const params = new URLSearchParams(location.search);
const jogoId = params.get('jogo');

if (!jogo) { location.replace('menu.html'); }

const $ = id => document.getElementById(id);
function criar(tag, classe, texto) { const x = document.createElement(tag); if (classe) x.className = classe; if (texto !== undefined) x.textContent = texto; return x; }
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

if (jogo) {
    document.title = `${jogo.nome} - Antes de jogar`;
    $('nome').textContent = jogo.nome;
    $('objetivo').textContent = jogo.objetivo;
    $('arte').innerHTML = ARTE[jogoId];
    jogo.passos.forEach(([icone, texto]) => {
        const li = criar('li');
        const ic = criar('span', 'ic'); ic.innerHTML = icone;
        const tx = criar('span'); tx.innerHTML = texto;
        li.appendChild(ic); li.appendChild(tx);
        $('passos').appendChild(li);
    });
    if (jogo.nota) { $('nota-rank').textContent = jogo.nota; $('nota-rank').hidden = false; }
    $('btn-iniciar').onclick = () => { location.href = `${jogo.arquivo}?partida=1`; };
}

/* ---------- ranking ---------- */
function mostrarMensagem(texto) {
    const r = $('ranking'); r.innerHTML = '';
    const v = criar('div', 'vazio'); v.innerHTML = ICO.trofeu; v.appendChild(criar('p', '', texto)); r.appendChild(v);
}
function esqueleto() {
    const r = $('ranking'); r.innerHTML = '';
    for (let i = 0; i < 4; i++) r.appendChild(criar('div', 'sk'));
    r.firstChild.style.marginBottom = '6px'; [...r.children].forEach((c, i) => { if (i) c.style.marginTop = '6px'; });
}
function linhaRanking(l, tipo) {
    const li = criar('li', 'rk' + (l.posicao <= 3 ? ' top' + l.posicao : '') + (l.eh_voce ? ' eu' : ''));
    li.appendChild(criar('span', 'pos', String(l.posicao)));
    const nome = criar('span', 'nome', l.nome_usuario || 'Jogador');
    if (l.eh_voce) nome.appendChild(criar('span', 'voce', 'você'));
    li.appendChild(nome);
    const valor = criar('span', 'valor');
    if (tipo === 'arvores') {
        const ic = criar('span'); ic.innerHTML = ICO.arvore; ic.style.display = 'inline'; valor.appendChild(ic.firstElementChild);
        valor.appendChild(document.createTextNode(String(l.arvores)));
        if (l.tempo_total) valor.appendChild(criar('small', '', `tempo ${mmss(l.tempo_total)}`));
    } else {
        valor.appendChild(document.createTextNode(`${l.melhor_pontuacao} pts`));
        if (tipo === 'pontos_tempo' && l.melhor_tempo_segundos) valor.appendChild(criar('small', '', `mais rápido: ${l.melhor_tempo_segundos}s`));
    }
    li.appendChild(valor);
    return li;
}
function desenharRanking(linhas, tipo) {
    if (!linhas) return mostrarMensagem('Não foi possível carregar o ranking agora.');
    if (!linhas.length) return mostrarMensagem('Ainda não há recordes. Seja o primeiro!');
    const ol = criar('ol', 'rank');
    let anterior = 0;
    linhas.forEach(l => {
        if (anterior && l.posicao > anterior + 1) ol.appendChild(criar('li', 'reticencias', '···'));
        ol.appendChild(linhaRanking(l, tipo));
        anterior = l.posicao;
    });
    $('ranking').innerHTML = ''; $('ranking').appendChild(ol);
}
if (jogo) {
    esqueleto();
    window.paginaLiberada.then(ok => {
        if (!ok) return;
        const busca = jogo.ranking === 'arvores' ? carregarRankingReflorestar(10) : carregarRanking(jogoId, 10);
        busca.then(linhas => desenharRanking(linhas, jogo.ranking));
    });
}
</script>
</body>
</html>
